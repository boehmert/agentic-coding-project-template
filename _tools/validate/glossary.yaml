# Terminology Glossary
#
# Canonical terms for terminology consistency checks.
# Format: term → list of accepted variants (case-insensitive).
#
# Customize this file with your project's domain terminology.
# See: _tools/validate/terminology_check.py

# --- Standards ---
SHACL:
  canonical: "SHACL"
  variants: ["Shacl", "shacl"]
  description: "Shapes Constraint Language (W3C)"
  category: standard

RDF:
  canonical: "RDF"
  variants: ["rdf", "Rdf"]
  description: "Resource Description Framework"
  category: standard

JSON-LD:
  canonical: "JSON-LD"
  variants: ["json-ld", "Json-LD", "jsonld", "JSONLD"]
  description: "JSON for Linked Data"
  category: format

# --- Concepts ---
Knowledge_Graph:
  canonical: "Knowledge Graph"
  variants: ["knowledge graph", "KG", "kg"]
  description: "Knowledge graph for semantic linking"
  category: concept

RAG:
  canonical: "RAG"
  variants: ["rag", "Rag"]
  description: "Retrieval-Augmented Generation"
  category: concept

Taxonomy:
  canonical: "Taxonomy"
  variants: ["taxonomy"]
  description: "Hierarchical classification system"
  category: concept

Ontology:
  canonical: "Ontology"
  variants: ["ontology"]
  description: "Formal domain model with classes, properties and constraints"
  category: concept

# --- Process ---
DoR:
  canonical: "Definition of Ready"
  variants: ["DoR", "dor", "Definition of ready"]
  description: "Criteria for ticket readiness"
  category: process

Sprint:
  canonical: "Sprint"
  variants: ["sprint", "Iteration"]
  description: "Development iteration cycle"
  category: process

